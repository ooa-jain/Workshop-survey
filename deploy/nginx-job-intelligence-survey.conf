server {
    listen 80;
    server_name job-intelligence.juooa.cloud;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/job-intelligence-survey/app/static/;
        expires 30d;
    }
}

# After this is live, run:
#   certbot --nginx -d job-intelligence.juooa.cloud
# Certbot will rewrite this file to add the SSL block and a port-80 redirect,
# same as the rest of the juooa.cloud sites.
